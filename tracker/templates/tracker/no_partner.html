<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partner Required - LoveTracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top left, #fff0f3, #ffe5ec);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .back-btn {
            position: absolute;
            top: 30px;
            left: 30px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: white;
            border-radius: 12px;
            text-decoration: none;
            color: #ff4d6d;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.15);
            transition: all 0.2s;
        }
        
        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 77, 109, 0.25);
        }

        .card {
            text-align: center;
            padding: 50px 40px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.06);
            max-width: 500px;
            width: 90%;
            margin-top: 40px; /* offset for mobile back button */
        }

        .icon {
            font-size: 70px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        h2 {
            color: #111827;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 16px;
            margin-top: 0;
        }

        p {
            color: #6B7280;
            font-size: 15px;
            margin-bottom: 35px;
            line-height: 1.6;
        }

        .btn-primary {
            display: inline-block;
            padding: 14px 32px;
            background: linear-gradient(135deg, #ff4d6d, #ff8fa3);
            color: white;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 8px 20px rgba(255, 77, 109, 0.25);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(255, 77, 109, 0.35);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
        
        @media (max-width: 768px) {
            .back-btn { top: 20px; left: 20px; padding: 8px 16px; font-size: 14px; }
            .card { padding: 40px 30px; }
        }
    </style>
</head>
<body>

    <a href="{% url 'dashboard' %}" class="back-btn">
        <span>←</span> Back
    </a>

    <div class="card">
        <div class="icon">💌</div>
        
        <h2>Please add your partner first!</h2>
        
        <p>
            This section is locked because it's meant to be shared. 
            Connect with your better half to unlock movies, memories, songs, and all the magical features of LoveTracker.
        </p>
        
        <a href="{% url 'profile' %}" class="btn-primary">
            Connect with Partner
        </a>
    </div>

</body>
</html>
