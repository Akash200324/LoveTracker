{% extends 'tracker/base.html' %}

{% block title %}Password Reset Complete{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block auth_content %}
<div class="auth-card">
    <div class="auth-logo">✅</div>
    <h2 class="auth-title">Success!</h2>
    <p class="auth-sub" style="margin-bottom: 25px;">Your password has been successfully reset.</p>
    
    <a href="{% url 'login' %}" class="btn btn-primary" style="width:100%; display: inline-block; text-align: center;">
        Login Now
    </a>
</div>
{% endblock %}
